<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visual Office · Kantor Agent AI</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="favicon.svg" alt="" />
      <input id="companyName" class="company" title="Klik untuk mengganti nama perusahaan" />
    </div>
    <div class="modes" role="tablist">
      <button id="modeView" class="mode active" title="Mode lihat (V)"><i data-icon="eye"></i> Lihat</button>
      <button id="modeEdit" class="mode" title="Mode edit layout (E)"><i data-icon="layout"></i> Edit Layout</button>
    </div>
    <div class="toolbar">
      <label class="toggle" title="Karyawan bergerak sendiri (ngopi, ngobrol, dll.)"><input type="checkbox" id="ambient" /><span class="lbl-wide">Aktivitas </span>otomatis</label>
      <label class="toggle" title="Agen mengerjakan tugas dengan AI sungguhan (Gemini gratis)"><input type="checkbox" id="aiMode" /> <span class="lbl-wide">Mode </span>AI</label>
      <span id="aiStatus" class="pill">…</span>
      <select id="rpm" title="Batas panggilan AI per menit (free tier Gemini ± 10–15/menit)">
        <option value="5">5/mnt</option><option value="10">10/mnt</option><option value="15">15/mnt</option><option value="30">30/mnt</option><option value="60">60/mnt</option>
      </select>
      <select id="speed" title="Kecepatan simulasi">
        <option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option>
      </select>
      <div class="modes viewseg" role="group" aria-label="Tampilan 2D / 3D">
        <button id="view2d" class="mode" title="Denah 2D dari atas (tombol 2)">2D</button>
        <button id="view3d" class="mode active" title="Tampilan 3D isometrik (tombol 3)">3D</button>
      </div>
      <button id="btnTelegram" title="Beri perintah lewat bot Telegram"><i data-icon="send"></i><span class="lbl-wide"> Telegram</span></button>
      <button id="btnFit" title="Tampilkan seluruh kantor (F)"><i data-icon="maximize"></i></button>
      <button id="btnExport" title="Simpan ke file JSON"><i data-icon="download"></i><span class="lbl-wide"> Export</span></button>
      <button id="btnImport" title="Muat dari file JSON"><i data-icon="upload"></i><span class="lbl-wide"> Import</span></button>
      <button id="btnSample" title="Isi kantor dengan contoh divisi & karyawan"><i data-icon="sparkles"></i><span class="lbl-wide"> Contoh</span></button>
      <button id="btnReset" class="danger" title="Kosongkan kantor (mulai dari nol)"><i data-icon="reset"></i><span class="lbl-wide"> Kosongkan</span></button>
      <span class="sep"></span>
      <span class="who" id="who" title="Kamu adalah Boss"><i data-icon="crown"></i> <span id="whoName">Boss</span></span>
      <a class="btn" id="btnLogout" href="/api/logout" title="Keluar"><i data-icon="logout"></i></a>
      <input type="file" id="importFile" accept="application/json,.json" hidden />
    </div>
  </header>

  <main class="layout">
    <aside class="panel left">
      <div class="panel-head">
        <h2>Struktur Organisasi</h2>
        <button id="addDivision" class="small primary"><i data-icon="plus"></i> Divisi</button>
      </div>
      <div id="orgTree" class="tree"></div>
      <div class="stats" id="stats"></div>
    </aside>

    <section class="stage">
      <canvas id="office"></canvas>
      <div class="zoomctl" role="group" aria-label="Zoom layout">
        <button id="zoomIn" title="Perbesar (+)" aria-label="Perbesar">+</button>
        <button id="zoomPct" class="pct" title="Klik untuk lihat seluruh kantor" aria-label="Level zoom">100%</button>
        <button id="zoomOut" title="Perkecil (−)" aria-label="Perkecil">−</button>
        <button id="zoomFit" title="Tampilkan seluruh kantor (F)" aria-label="Pas layar"><i data-icon="maximize"></i></button>
      </div>
      <nav id="roomTabs" class="roomtabs" aria-label="Lompat ke ruangan"></nav>
      <div id="editBar" class="editbar hidden">
        <div class="group">
          <span class="lbl">Alat:</span>
          <button data-tool="move" class="tool active" title="Geser & ubah ukuran ruangan / zona"><i data-icon="hand"></i> Pindah</button>
          <button data-tool="erase" class="tool" title="Hapus furnitur"><i data-icon="eraser"></i> Hapus</button>
        </div>
        <div class="group" id="furniturePalette"><span class="lbl">Furnitur:</span></div>
        <div class="group">
          <span class="lbl">Ruang:</span>
          <button data-fac="meeting" class="small"><i data-icon="plus"></i> Rapat</button>
          <button data-fac="pantry" class="small"><i data-icon="plus"></i> Pantry</button>
          <button data-fac="lounge" class="small"><i data-icon="plus"></i> Lounge</button>
          <button data-fac="pool" class="small"><i data-icon="plus"></i> Kolam</button>
          <button data-fac="billiard" class="small"><i data-icon="plus"></i> Biliar</button>
        </div>
        <div class="group">
          <span class="lbl">Tata ruang:</span>
          <select id="layoutSel" title="Satu ruangan: direktur & semua tim divisi dalam satu ruangan terbuka">
            <option value="open">Satu ruangan (open plan)</option>
            <option value="rooms">Ruang per departemen</option>
          </select>
          <span class="lbl">Lantai:</span>
          <select id="floorSel"></select>
          <span class="lbl">Peta:</span>
          <input type="number" id="mapW" min="30" max="160" title="Lebar (tile)" />×<input type="number" id="mapH" min="20" max="120" title="Tinggi (tile)" />
          <button id="btnAuto" class="small primary" title="Susun ulang semua ruangan otomatis"><i data-icon="wand"></i> Tata Otomatis</button>
        </div>
      </div>
      <div id="chat" class="chat hidden" aria-live="polite">
        <div class="chat-head">
          <img id="chatImg" alt="" />
          <div class="who2"><div class="n" id="chatName"></div><div class="r" id="chatRole"></div></div>
          <button class="icon" id="chatClose" title="Tutup chat"><i data-icon="x"></i></button>
        </div>
        <div class="chat-body" id="chatBody"></div>
        <div class="chat-note" id="chatNote"></div>
        <form class="chat-foot" id="chatForm">
          <textarea id="chatInput" placeholder="Tulis pesan… (Enter untuk kirim)"></textarea>
          <button class="primary" type="submit" title="Kirim"><i data-icon="send"></i></button>
        </form>
      </div>
      <div id="emptyStage" class="empty-stage hidden">
        <div class="box">
          <i data-icon="building" class="big"></i>
          <h2>Kantormu masih kosong</h2>
          <p>Kamu adalah <b>Boss</b>-nya. Mulai dengan membuat divisi, lalu tambahkan departemen dan rekrut karyawan agent AI.</p>
          <div class="row">
            <button class="primary" id="emptyAddDiv"><i data-icon="plus"></i> Tambah Divisi</button>
            <button id="emptySample"><i data-icon="sparkles"></i> Muat contoh</button>
          </div>
        </div>
      </div>
      <div class="hint" id="hint">Scroll = zoom · Drag = geser · Klik karyawan untuk detail</div>
    </section>

    <aside class="panel right">
      <section class="card" id="inspector"></section>
      <section class="card">
        <h3><i data-icon="send"></i> Perintah Boss</h3>
        <form id="taskForm" class="task-form">
          <textarea id="taskTitle" rows="2" placeholder="Contoh: Buat rencana peluncuran produk AI baru" required></textarea>
          <div class="row">
            <select id="taskTarget"></select>
            <button type="submit" class="primary">Kirim</button>
          </div>
        </form>
      </section>
      <section class="card grow">
        <div class="tabs">
          <button class="tab active" data-tab="tasks">Tugas</button>
          <button class="tab" data-tab="docs"><i data-icon="book"></i> Dokumen <span id="docCount" class="badge">0</span></button>
          <button class="tab" data-tab="log">Aktivitas</button>
        </div>
        <div id="taskList" class="list"></div>
        <div id="docPane" class="list hidden">
          <div class="doc-tools">
            <input type="text" id="docSearch" placeholder="Cari dokumen…" />
            <button id="docUpload" class="small" title="Unggah .txt / .md sebagai pengetahuan untuk agen"><i data-icon="upload"></i> Unggah</button>
            <input type="file" id="docFile" accept=".txt,.md,.markdown,.csv,.json,text/*" multiple hidden />
          </div>
          <div id="docList" class="list"></div>
        </div>
        <div id="logList" class="list hidden"></div>
      </section>
    </aside>
  </main>

  <dialog id="dlg">
    <form method="dialog" id="dlgForm">
      <h3 id="dlgTitle"></h3>
      <div id="dlgBody"></div>
      <menu>
        <button value="cancel" formnovalidate>Batal</button>
        <button value="ok" class="primary" id="dlgOk">Simpan</button>
      </menu>
    </form>
  </dialog>

  <dialog id="resultDlg" class="wide">
    <form method="dialog">
      <h3 id="resultTitle"></h3>
      <div id="resultBody" class="result"></div>
      <menu><button value="ok" class="primary">Tutup</button></menu>
    </form>
  </dialog>

  <div id="toast" class="toast"></div>

  <script src="js/icons.js"></script>
  <script src="js/model.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/integrations.js"></script>
  <script src="js/gudang.js"></script>
  <script src="js/minimarket.js"></script>
  <script src="js/publicdata.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/telegram.js"></script>
  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js","three/addons/":"./vendor/three/addons/"}}</script>
  <script type="module" src="js/scene3d.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
